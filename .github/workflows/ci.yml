name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://xiaohai:xiaohai@127.0.0.1:3306/xiaohai
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @xiaohai/database exec prisma validate
      - run: pnpm typecheck
      - run: pnpm --filter @xiaohai/api test
      - run: pnpm build
