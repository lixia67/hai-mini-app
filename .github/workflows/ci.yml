name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @xiaohai/database generate
      - run: pnpm --filter @xiaohai/database exec prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: mysql://xiaohai:xiaohai@localhost:3306/xiaohai
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
